name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # macOS runner GitHub-аас олгогдохгүй цуцлагдах нь давтагддаг (2026-11-03) - мэдээллийн job, CI-г унагахгүй.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    env:
      SB_READ_TOKEN: ${{ secrets.SB_READ_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
        # macOS + 3.9 runner-ийг GitHub олгохгүй дараалалд цуцлагддаг (2026-11-03); macOS-ийг 3.12-оор шалгана.
        exclude:
          - os: macos-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      # uv installs the exact Python on every OS/arch (incl. 3.9 on Apple Silicon runners).
      - uses: astral-sh/setup-uv@v6

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # Runs tests/test_hooks.py, test_onboard.py, test_doctor.py, test_tools.py and
      # tools/relay/tests/test_relay_config.py (shims + canonical copy; missing ones are skipped),
      # JSON validity under plugins/ and .claude-plugin/,
      # SKILL.md frontmatter, and a personal-path scan of shipped files.
      - name: Tests and checks
        run: uv run --no-project --python ${{ matrix.python }} python .github/scripts/ci_checks.py

      # The offline e2e harness and vault tests need second-brain's tools/chat (private repo).
      # Without the SB_READ_TOKEN secret (read-only PAT for Atlas322/second-brain) they skip.
      - name: Check out second-brain tools (optional)
        if: (success() || failure()) && matrix.python == '3.12' && matrix.os != 'windows-latest' && env.SB_READ_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: Atlas322/second-brain
          token: ${{ secrets.SB_READ_TOKEN }}
          path: _second-brain
          sparse-checkout: tools

      # Goom chat pipeline (dispatcher, headless guard, isolation, offline e2e harness) is
      # pytest-only and needs Python 3.12+ (fm_goom_dispatch preflight). Windows is not a
      # dispatcher host, so it is left out. tests/conftest.py points HOME at a temp dir.
      - name: Goom pipeline tests (pytest)
        # Runs even when ci_checks fails (pre-existing test_onboard failure), so it is never hidden.
        if: (success() || failure()) && matrix.python == '3.12' && matrix.os != 'windows-latest'
        env:
          SB_TOOLS: ${{ github.workspace }}/_second-brain
        run: >-
          uv run --no-project --python 3.12 --with pytest python -m pytest -q
          tests/test_headless_guard.py tests/test_headless_worker.py
          tests/test_goom_isolation.py tests/test_goom_pipeline_e2e.py
          tests/test_fm_goom_dispatch.py tests/test_fm_goom_control.py
          tests/test_goom_agent.py tests/test_goom_chat_threads.py tests/test_goom_chat_vault.py
          tests/test_goom_mirror.py tests/test_goom_pull.py tests/test_goom_session_chat.py
          tests/test_goom_session_runs.py tests/test_goom_stall.py tests/test_goom_sync.py

  validate-plugin:
    name: claude plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Claude Code CLI may require authentication in CI; never block a PR on it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate plugin fm (strict)
        # The npm CLI does not know the desktop-only `types` manifest field (mods state
        # contract, required by the desktop app), so that single warning is tolerated;
        # any other warning or error still fails. Validate locally with the desktop claude.exe.
        run: |
          set +e
          out=$(npx -y @anthropic-ai/claude-code plugin validate --strict plugins/fm 2>&1); rc=$?
          echo "$out"
          [ $rc -eq 0 ] && exit 0
          if ! echo "$out" | grep -qE 'Found [0-9]+ error'              && echo "$out" | grep -qE 'Found 1 warning'              && echo "$out" | grep -q "Unknown field 'types'"; then echo "only the known 'types' warning - OK"; exit 0; fi
          exit 1

      - name: Validate marketplace founder-matrix (strict)
        if: always()
        # The npm CLI does not know the desktop-only `types` manifest field (mods state
        # contract, required by the desktop app), so that single warning is tolerated;
        # any other warning or error still fails. Validate locally with the desktop claude.exe.
        run: |
          set +e
          out=$(npx -y @anthropic-ai/claude-code plugin validate --strict . 2>&1); rc=$?
          echo "$out"
          [ $rc -eq 0 ] && exit 0
          if ! echo "$out" | grep -qE 'Found [0-9]+ error'              && echo "$out" | grep -qE 'Found 1 warning'              && echo "$out" | grep -q "Unknown field 'types'"; then echo "only the known 'types' warning - OK"; exit 0; fi
          exit 1
