<!doctype html>
<html><head><meta charset="utf-8"><title>FM Prompter</title>
<style>
/* Караоке телепромптер (Wiki-ийн teleprompter.html-ээс): цаг = Premiere-ийн playhead, өгүүлбэр = sequence marker (name = текст). */
:root{--bg:#0b0d16;--stage:#10142a;--ink:#f4f5fb;--dim:#5b6080;--sung:#ffd24a;--line:#232845;
  --display:"Noto Sans","Segoe UI",system-ui,sans-serif;--mono:Consolas,ui-monospace,monospace}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--display);padding:10px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
button{font:inherit;font-size:12px;color:var(--ink);background:var(--stage);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:700}
button.on{background:var(--sung);color:#1a1300;border-color:var(--sung)}
.clock{font-family:var(--mono);font-size:15px;min-width:6ch;text-align:right}
.stage{position:relative;flex:1;background:var(--stage);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;justify-content:center;padding:20px clamp(12px,4vw,48px);overflow:hidden}
.stage.mirror .lines{transform:scaleX(-1)}
.lines{display:flex;flex-direction:column;gap:22px}
.ln{font-weight:900;line-height:1.15;transition:opacity .2s,font-size .2s}
.ln.prev{font-size:clamp(16px,2.6vw,26px);opacity:.35}
.ln.cur{font-size:clamp(28px,6vw,68px)}
.ln.next{font-size:clamp(18px,3vw,32px);color:var(--dim)}
.w{color:var(--dim)}.w.on{color:var(--ink)}.w.done{color:var(--sung)}
.w.on .f{background:linear-gradient(90deg,var(--sung) var(--p,0%),var(--ink) var(--p,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
.cue{position:absolute;top:10px;right:14px;font-family:var(--mono);font-size:12px;color:var(--dim)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--sung)}
.empty{color:var(--dim);font-size:16px;text-align:center}
</style></head>
<body>
<div class="bar">
  <b id="seq">sequence…</b>
  <span class="clock" id="clock">0.00</span>
  <button id="mirror" title="Толь (teleprompter шилэнд)">Толь</button>
  <button id="reload" title="Marker-уудыг дахин унших">↻</button>
</div>
<div class="prog"><i id="pg"></i></div>
<div class="stage" id="stage"><span class="cue" id="cue"></span><div class="lines" id="lines"></div></div>
<script src="prompter.js"></script>
<script>
// CEP: playhead-ийг нэг удаад нэг хөнгөн evalScript-ээр (өмнөх нь буцаж ирээгүй бол дахин дуудахгүй — panel гацахгүй)
var cs = window.__adobe_cep__;
function ev(src) { return new Promise(function (r) { cs.evalScript(src, r); }); }
var POS = "(function(){var s=app.project.activeSequence;return s?s.getPlayerPosition().seconds+'|'+s.name:''})()";
var MARK = "JSON.stringify(typeof FM!=='undefined'?FM.promptMarkers():[])";   // fm.jsx = manifest ScriptPath
var P = Prompter(document), seqName = '', busy = false;
function loadMarkers() { return ev(MARK).then(function (s) { try { P.setLines(JSON.parse(s)); } catch (e) { P.setLines([]); } }); }
function poll() {
  if (busy) return; busy = true;
  ev(POS).then(function (s) {
    busy = false; if (!s) return;
    var p = s.indexOf('|'), t = parseFloat(s.slice(0, p)), name = s.slice(p + 1);
    if (name !== seqName) { seqName = name; document.getElementById('seq').textContent = name; loadMarkers(); }
    P.paint(t);
  });
}
setInterval(poll, 66);           // ~15/с
setInterval(loadMarkers, 2000);  // marker засварыг дагана
document.getElementById('reload').onclick = loadMarkers;
document.getElementById('mirror').onclick = function () { this.classList.toggle('on'); document.getElementById('stage').classList.toggle('mirror'); };
loadMarkers();
</script>
</body></html>
