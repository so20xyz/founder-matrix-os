<style>
  /* Bridge панел · A · Фокус (itge.e 2026-10-16) — [[2026-10-16 - Bridge панел A · Фокус хувилбар]] */
  :root{--bg:#1e1e20;--sf:#2a2a2e;--el:#34343a;--bd:#3f3f47;--tx:#f2f2f4;--t2:#adadb8;--ac:#e4f25c;--ink:#1a1a1a;
    --open:#9ecbff;--wait:#f0c650;--done:#8fd694;--err:#ff7b72;--work:#dd866a;

  #tabs button:hover{color:var(--tx)}
  #tabs button.on{color:var(--tx)}
  #tabs button[data-p="c"]{background:var(--el);color:var(--tx);padding:4px 10px;font-weight:500}
  #tabs button[data-p="c"]:not(.on){background:none;color:var(--t2)}
  #col{background:none;border:0;color:var(--t2);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
  #col:hover{background:var(--el);color:var(--tx)}
  /* төлөвийн мөрүүд */
  #cl{display:grid;grid-template-columns:16px 1fr auto;column-gap:10px;align-items:center;margin:10px 12px 0;padding:9px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;font-size:12px;color:var(--t2)}

  #pl{border-bottom:1px solid var(--bd);padding:7px 12px;display:none}#pl.on{display:block}
  #pl .ph{color:var(--t2);font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;display:flex}

  #pl .pr.run{color:var(--tx)}#pl .pr.done{color:var(--done)}
  #pl .pr .m{width:12px;flex:0 0 auto;text-align:center}

  /* 2 · гүйлгэх хэсэг */

  /* thread: зүүн 3px зураас + төлөвийн pill */

  .msg.root{margin-top:0}

  .msg .spk{color:var(--ac);margin-right:6px}
  .msg.user .who{color:var(--ac)}.msg.claude .who{color:var(--open)}

  .msg.live .lvd{color:var(--t2);word-break:break-all}.msg.live .lvm{color:var(--t2);font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
  .msg.clp{position:relative}
  .mt{margin-top:5px;color:var(--t2);font-size:11px;cursor:pointer;font-variant-numeric:tabular-nums;user-select:none}
  .mt u{color:var(--open);text-decoration:none;font-weight:600}.mt:hover u{text-decoration:underline}
  .more{color:var(--t2);cursor:pointer;margin:4px 0 4px 8px;font-size:11px}.more:hover{color:var(--tx)}
  .cnt{color:var(--t2);font-size:11px;margin-left:6px}
  .node{display:inline-block;color:var(--tx);background:var(--el);border-radius:6px;padding:1px 7px;cursor:pointer;margin:0 2px 3px 0}
  .node:hover{background:var(--bd)}
  .lk{color:var(--open);cursor:pointer}.lk:hover{text-decoration:underline}
  .del{color:var(--t2);cursor:pointer;margin-left:4px;font-size:11px;visibility:hidden}.msg:hover .del{visibility:visible}.del:hover{color:var(--err)}
  .play{color:var(--ac);cursor:pointer;margin-left:6px}
  .acts{margin-left:auto;display:flex;gap:10px;font-size:11px;opacity:0;transition:opacity .12s}.acts + .pill{margin-left:10px}.th:hover .acts,.th.solo .acts{opacity:1}
  .acts a{color:var(--t2);cursor:pointer}.acts a:hover{color:var(--tx)}
  .wk{color:var(--work);font-size:12px;margin-bottom:6px;display:flex;gap:6px;align-items:center}
  .wsp{display:inline-block;animation:spin 1.6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .st{font-size:11px;margin:6px 0 2px;padding:4px 8px;border-radius:6px;background:var(--el);color:var(--t2)}
  .st.working{color:var(--wait)}
  /* санал сонголт: дугаарласан мөр, эхнийх нь тодорсон */
  .ch{margin:8px 0 2px;display:flex;flex-direction:column;gap:6px}
  .ch::before{content:"САНАЛ · НЭГИЙГ СОНГО";font:500 10px var(--mono);letter-spacing:.08em;color:var(--t2);margin-bottom:1px}
  .op{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:9px;padding:7px 10px 7px 8px;background:var(--bg);cursor:pointer}
  .op:hover{border-color:var(--t2)}
  .op .no{flex:0 0 22px;height:22px;border-radius:5px;background:var(--el);color:var(--t2);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center}
  .op .ol{flex:1;min-width:0;font-size:13px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .op .lk{flex:0 0 auto;font-size:13px}
  .op.on{border-color:var(--ac)}.op.on .no{background:var(--ac);color:var(--ink)}
  .ch.done .op{cursor:default}
  .cha{color:var(--done);font-size:12px}
  /* thread дотрох хариулт */
  .fc{display:inline-block;font-size:10px;line-height:1.5;color:var(--t2);background:var(--el);border-radius:5px;padding:0 6px;cursor:pointer;margin:0 3px 2px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}.fc:hover{color:var(--tx);background:var(--bd)}
  .qr{display:flex;gap:6px;margin-top:8px;border-top:1px solid var(--bd);padding-top:7px}
  .qr input{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:7px;padding:4px 8px;font:12px var(--sans)}
  .qr button{background:var(--ac);color:var(--ink);border:0;border-radius:7px;padding:3px 10px;font:600 12px var(--sans);cursor:pointer}
  .rbox{margin-top:8px;border-top:1px solid var(--bd);padding-top:8px}
  .rbox textarea{height:46px}
  .rrow{display:flex;gap:10px;align-items:center;margin-top:5px;font-size:12px}.rrow a{color:var(--t2);cursor:pointer}.rrow a:hover{color:var(--tx)}
  .rrow button{margin-left:auto;background:var(--ac);color:var(--ink);border:0;border-radius:8px;padding:4px 12px;font:600 13px var(--sans);cursor:pointer}
  .thumbs{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.thumbs img{height:54px;border-radius:6px;border:1px solid var(--bd);cursor:pointer;object-fit:cover;max-width:120px;background:var(--el)}
  .rbox .thumbs img{cursor:not-allowed}
  #back{color:var(--ac);cursor:pointer}
  /* зургийн таб */
  #gbar{display:flex;gap:6px;padding:4px 0 8px}
  #gbar input,#gbar select{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font:12px var(--sans)}
  #gbar button{background:var(--el);color:var(--tx);border:0;border-radius:8px;padding:0 9px;cursor:pointer}
  #gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
  #gg .gi{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--el);cursor:grab;border:1px solid var(--bd)}
  #gg .gi:hover{border-color:var(--open)}#gg .gi img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  #gg .gi span{position:absolute;left:0;right:0;bottom:0;padding:3px 5px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ghint{color:var(--t2);font-size:11px;text-align:center;margin:10px 0 4px}
  /* 3 · доор тогтмол оролт */
  #box{background:var(--sf);padding:10px 12px 12px;display:none}#box.on{display:block}
  #sel{margin:10px 12px 0;background:var(--el);border:1px solid var(--bd);border-radius:9px;padding:8px 11px;color:var(--tx);font-size:12px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  #sel.hide{display:none}
  #sel .lb{display:block;font:500 10px var(--mono);letter-spacing:.08em;color:var(--t2);margin-bottom:2px}
  #sel .lb i{font-style:normal;color:var(--open)}
  #sel b{font-weight:400;font-size:12.5px;color:var(--tx)}
  #sel .node{background:var(--bd)}
  textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;font:13px/1.45 var(--sans);resize:none;height:40px;transition:height .12s}
  textarea:focus,textarea.fill{height:72px}
  textarea:focus{outline:none;border-color:var(--t2)}
  textarea::placeholder{color:var(--t2)}
  #att{display:flex;gap:2px;align-items:center;margin:8px 0 0;font-size:14px}
  #att a{color:var(--t2);cursor:pointer;padding:3px 5px;border-radius:6px}#att a:hover{background:var(--el);color:var(--tx)}
  #attl{margin-bottom:4px}#attl .node{cursor:pointer}
  #send{margin-left:auto;background:var(--ac);color:var(--ink);border:0;border-radius:9px;padding:8px 16px;font:600 13px var(--sans);cursor:pointer}
  #send:hover{filter:brightness(1.05)}
  #grip{position:fixed;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;z-index:9;opacity:.5;background:linear-gradient(135deg,transparent 0 45%,var(--t2) 45% 52%,transparent 52% 64%,var(--t2) 64% 71%,transparent 71%)}
  #grip:hover{opacity:1}
  body.collapsed #st,body.collapsed #pl,body.collapsed #sel,body.collapsed #cl,body.collapsed .pane,body.collapsed #box,body.collapsed #grip{display:none!important}
</style>
<div id="h"><div id="dot"></div><div class="ttl" id="s">холбогдож байна…</div>
  <div id="tabs"><button data-p="c" class="on" title="Коммент">💬 <span id="n"></span></button><button data-p="g" title="Зураг">🖼</button><button data-p="l" title="Лог">≡</button></div><button id="col" title="Хураах / дэлгэх (header дээр 2 дарах)">⌄</button></div>

<script>
let ws, info = { file: '?', editor: 'figma' }, sel = null, sels = [], all = [], replyTo = null;
let ME = 'Би'; fetch('http://localhost:3055/member').then(r => r.json()).then(j => { if (j.member) { ME = j.member; render(); } }).catch(() => {});
const $ = (id) => document.getElementById(id);
const s = $('s'), dot = $('dot'), L = $('l'), C = $('c');
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === b.dataset.p));
  $('box').classList.toggle('on', b.dataset.p === 'c'); $('sel').classList.toggle('hide', b.dataset.p !== 'c'); });
let plan = null;
const mmss = (ms) => { const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ':' + ('0'+(s%60)).slice(-2); };
function renderPlan(){
  const box = $('pl'); if (!box) return;
  if (!plan || !plan.steps || !plan.steps.length) { box.className=''; box.innerHTML=''; return; }
  box.className = 'on';
  const now = Date.now();
  const run = plan.steps.filter(s => s.state === 'run')[0];
  const done = plan.steps.filter(s => s.state === 'done').length;
  const elapsed = plan.start ? now - plan.start : 0;
  let etaLeft = 0;
  for (const s of plan.steps) if (s.state !== 'done') etaLeft += (s.eta || 0) * 1000;
  if (run && run.start) etaLeft -= Math.min((run.eta||0)*1000, now - run.start);
  const head = '<div class="ph">' + (plan.title || 'Төлөвлөгөө') +
    '<span>' + done + '/' + plan.steps.length + ' · ' + mmss(elapsed) +
    (etaLeft > 0 ? ' · ~' + mmss(etaLeft) + ' үлдсэн' : '') + '</span></div>';
  const rows = plan.steps.map(s => {
    const mark = s.state === 'done' ? '✓' : (s.state === 'run' ? '◐' : (s.state === 'err' ? '✕' : '○'));
    const cls = s.state === 'run' ? ' run' : (s.state === 'done' ? ' done' : '');
    let time = '';
    if (s.state === 'run' && s.start) time = mmss(now - s.start) + (s.eta ? ' / ~' + mmss(s.eta*1000) : '');
    else if (s.state === 'done' && s.ms) time = mmss(s.ms);
    else if (s.eta) time = '~' + mmss(s.eta*1000);
    return '<div class="pr' + cls + '"><span class="m">' + mark + '</span>' + esc(s.label) +
      '<span class="t">' + time + '</span></div>';
  }).join('');
  let pct = 0;
  if (run && run.start && run.eta) pct = Math.min(100, Math.round((now - run.start) / (run.eta*10)));
  const bar = run ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : '';
  box.innerHTML = head + rows + bar;
}
setInterval(renderPlan, 1000);
function setState(msg, kind, t){ const st=$('st'); if(!st) return;
  $('sx').textContent = msg;
  $('stm').textContent = hhmm(t || Date.now());
  st.className = kind==='err' ? 'err' : (kind==='ok' ? 'done' : 'live');
}
function add(msg, kind, t, node){
  const m = String(msg);
  if (m.indexOf('@plan ') === 0) { try { plan = JSON.parse(m.slice(6)); plan.start = plan.start || Date.now(); } catch(e) { plan = null; } renderPlan(); return; }
  if (m.indexOf('@step ') === 0) {
    try { const u = JSON.parse(m.slice(6));
      if (plan) { for (const st of plan.steps) if (st.id === u.id) {
        if (u.state === 'run') st.start = Date.now();
        if (u.state === 'done' && st.start) st.ms = Date.now() - st.start;
        st.state = u.state; if (u.label) st.label = u.label; } }
      if (u.state === 'run') setState('◐ ' + (u.label || u.id), 'run', Date.now());
      if (u.state === 'done' && plan && plan.steps.every(x => x.state === 'done')) setState('✓ бүгд дууслаа', 'ok', Date.now());
    } catch(e) {}
    renderPlan(); return;
  }
  if (['state','run','step','ok','err'].indexOf(kind) >= 0) setState(msg, kind, t); const d=document.createElement('div'); d.className='r '+(kind||'');
  const tm=new Date(t||Date.now()); d.innerHTML='<span class="t">'+tm.toTimeString().slice(0,8)+'</span>'; d.appendChild(document.createTextNode(msg));
  L.appendChild(d); while(L.children.length>200) L.removeChild(L.firstChild); L.scrollTop=L.scrollHeight; }
const focusN = (id) => parent.postMessage({ pluginMessage: { focus: id } }, '*');
// @[нэр](nodeId) → дарахад тэр screen рүү очно
const fmt = (x) => esc(x)
  .replace(/@\[([^\]]+)\]\(([\d:;I]+)\)/g, '<span class="lk" data-n="$2">◎ $1</span>')
  .replace(/(^|[\s(])(\d+:\d+)(?=[\s,.)!?]|$)/g, '$1<span class="lk" data-n="$2">◎ $2</span>')
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/(^|\n)[-•] +/g, '$1 • ')
  .replace(/(^|\n)(①|②|③|④|⑤)/g, '$1<span class="num">$2</span>');

  $('gg').innerHTML = items.map(x => '<div class="gi" draggable="true" data-gp="' + esc(x.p) + '" title="' + esc(x.p) + ' · ' + x.kb + 'KB"><img loading="lazy" src="http://localhost:3055/file?p=' + encodeURIComponent(x.p) + '"><span>' + esc(x.name) + '</span></div>').join('') || '<div class="empty">Зураг алга</div>'; }
$('gq').oninput = renderGallery; $('gf').onchange = renderGallery; $('gr').onclick = loadGallery;
$('gg').addEventListener('click', (e) => { const g = e.target.closest('.gi'); if (g) post({ placeImage: g.dataset.gp }); });
$('gg').addEventListener('dragend', (e) => { const g = e.target.closest('.gi'); if (!g) return;
  parent.postMessage({ pluginDrop: { clientX: e.clientX, clientY: e.clientY, dropMetadata: { vaultPath: g.dataset.gp } } }, '*'); });
document.querySelector('[data-p="g"]').addEventListener('click', () => { if (!GAL.length) loadGallery(); });
connect(); render();
window.onmessage = (e) => { const m = e.data.pluginMessage; if (!m) return;
  if (m.uiState) { UI = { ...UI, ...m.uiState }; if (UI.collapsed) { document.body.classList.add('collapsed'); $('col').textContent = '▸'; } return; }
  if (m.info) { info = m.info; s.textContent = info.file; if (ws && ws.readyState === 1) ws.send(JSON.stringify({ hello: info })); return; }
  if (m.snap) { const d = D(m.snap.rid); d.imgs.push('data:image/png;base64,' + m.snap.data); if (!d.nodes.some(x => x.id === m.snap.node.id)) d.nodes.push(m.snap.node); showAtt(); return; }
  if (m.sel !== undefined) { sel = m.sel; sels = m.sels || (m.sel ? [m.sel] : []); showSel(); return; }
  if (m.log !== undefined) { add(m.log, m.kind, m.t, m.node); return; }
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
</script>
