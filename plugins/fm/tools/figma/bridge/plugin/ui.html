  /* ── Шилэн панел (frosted glass) · сунгах · хураах ── */
  body{background:radial-gradient(120% 60% at 0% 0%,rgba(120,140,255,.16),transparent 55%),radial-gradient(90% 50% at 100% 100%,rgba(228,242,92,.08),transparent 60%),linear-gradient(180deg,#232327 0%,#18181b 100%);overflow:hidden}

  #cl,#st,#pl{background:rgba(255,255,255,.035)!important;border-bottom:1px solid rgba(255,255,255,.06)!important;backdrop-filter:blur(14px)}

  #grip:hover{opacity:1}
  .th.work{border-color:rgba(217,119,87,.8)!important;box-shadow:0 0 0 1px rgba(217,119,87,.35),0 8px 24px -10px rgba(217,119,87,.5)}
  .wk{color:#d97757;font-size:11px;margin-bottom:6px;display:flex;gap:6px;align-items:center}
  .wsp{display:inline-block;animation:spin 1.6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .mt{margin-top:5px;color:#8a8f99;font-size:10.5px;cursor:pointer;font-variant-numeric:tabular-nums;user-select:none}
  .mt u{color:#9ecbff;text-decoration:none;font-weight:600}.mt:hover u{text-decoration:underline}
  .msg.clp{position:relative}
  .msg.live{color:#b9b9b9;font-size:11.5px}.msg.live .wsp{color:#d97757}.msg.live b.lvt{color:#e8e8e8;font-weight:600}
  .msg.live .lvd{color:#8a8a8a;word-break:break-all}.msg.live .lvm{color:#6a6a6a;font-size:10.5px;margin-top:2px;font-variant-numeric:tabular-nums}

  #gg .gi:hover{border-color:#9ecbff}#gg .gi img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  #gg .gi span{position:absolute;left:0;right:0;bottom:0;padding:3px 5px;font-size:9.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ghint{color:#6a6a6a;font-size:10.5px;text-align:center;margin:10px 0 4px}

</style>
<div id="h"><div id="dot"></div><div>Claude · <b id="s">холбогдож байна…</b></div>
  <div id="tabs" style="margin-left:auto"><button data-p="c" class="on">💬 <span id="n"></span></button><button data-p="g">🖼</button><button data-p="l">Лог</button></div><button id="col" title="Хураах / дэлгэх (header дээр 2 дарах)">▾</button></div>
<div id="cl" class="idle"><span class="sp">●</span><b id="clt">Claude</b><span class="d" id="cld">хүлээж байна</span><span class="m" id="clm"></span></div>
<div id="st"><span id="sd"></span><span id="sx">bridge холбогдож байна…</span><span id="stm"></span></div>

</div>
<script>
let ws, info = { file: '?', editor: 'figma' }, sel = null, all = [], replyTo = null;
let ME = 'Би'; fetch('http://localhost:3055/member').then(r => r.json()).then(j => { if (j.member) { ME = j.member; render(); } }).catch(() => {});
const $ = (id) => document.getElementById(id);
const s = $('s'), dot = $('dot'), L = $('l'), C = $('c');
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === b.dataset.p));
  $('box').classList.toggle('on', b.dataset.p === 'c'); });
let plan = null;
const mmss = (ms) => { const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ':' + ('0'+(s%60)).slice(-2); };
function renderPlan(){
  const box = $('pl'); if (!box) return;
  if (!plan || !plan.steps || !plan.steps.length) { box.className=''; box.innerHTML=''; return; }
  box.className = 'on';
  const now = Date.now();
  const run = plan.steps.filter(s => s.state === 'run')[0];
  const done = plan.steps.filter(s => s.state === 'done').length;
  const elapsed = plan.start ? now - plan.start : 0;
  let etaLeft = 0;
  for (const s of plan.steps) if (s.state !== 'done') etaLeft += (s.eta || 0) * 1000;
  if (run && run.start) etaLeft -= Math.min((run.eta||0)*1000, now - run.start);
  const head = '<div class="ph">' + (plan.title || 'Төлөвлөгөө') +
    '<span>' + done + '/' + plan.steps.length + ' · ' + mmss(elapsed) +
    (etaLeft > 0 ? ' · ~' + mmss(etaLeft) + ' үлдсэн' : '') + '</span></div>';
  const rows = plan.steps.map(s => {
    const mark = s.state === 'done' ? '✓' : (s.state === 'run' ? '◐' : (s.state === 'err' ? '✕' : '○'));
    const cls = s.state === 'run' ? ' run' : (s.state === 'done' ? ' done' : '');
    let time = '';
    if (s.state === 'run' && s.start) time = mmss(now - s.start) + (s.eta ? ' / ~' + mmss(s.eta*1000) : '');
    else if (s.state === 'done' && s.ms) time = mmss(s.ms);
    else if (s.eta) time = '~' + mmss(s.eta*1000);
    return '<div class="pr' + cls + '"><span class="m">' + mark + '</span>' + esc(s.label) +
      '<span class="t">' + time + '</span></div>';
  }).join('');
  let pct = 0;
  if (run && run.start && run.eta) pct = Math.min(100, Math.round((now - run.start) / (run.eta*10)));
  const bar = run ? '<div class="bar"><i style="width:' + pct + '%"></i></div>' : '';
  box.innerHTML = head + rows + bar;
}
setInterval(renderPlan, 1000);
function setState(msg, kind, t){ const st=$('st'); if(!st) return;
  $('sx').textContent = msg;
  $('stm').textContent = hhmm(t || Date.now());
  st.className = kind==='err' ? 'err' : (kind==='ok' ? 'done' : 'live');
}
function add(msg, kind, t, node){
  const m = String(msg);
  if (m.indexOf('@plan ') === 0) { try { plan = JSON.parse(m.slice(6)); plan.start = plan.start || Date.now(); } catch(e) { plan = null; } renderPlan(); return; }
  if (m.indexOf('@step ') === 0) {
    try { const u = JSON.parse(m.slice(6));
      if (plan) { for (const st of plan.steps) if (st.id === u.id) {
        if (u.state === 'run') st.start = Date.now();
        if (u.state === 'done' && st.start) st.ms = Date.now() - st.start;
        st.state = u.state; if (u.label) st.label = u.label; } }
      if (u.state === 'run') setState('◐ ' + (u.label || u.id), 'run', Date.now());
      if (u.state === 'done' && plan && plan.steps.every(x => x.state === 'done')) setState('✓ бүгд дууслаа', 'ok', Date.now());
    } catch(e) {}
    renderPlan(); return;
  }
  if (['state','run','step','ok','err'].indexOf(kind) >= 0) setState(msg, kind, t); const d=document.createElement('div'); d.className='r '+(kind||'');
  const tm=new Date(t||Date.now()); d.innerHTML='<span class="t">'+tm.toTimeString().slice(0,8)+'</span>'; d.appendChild(document.createTextNode(msg));
  L.appendChild(d); while(L.children.length>200) L.removeChild(L.firstChild); L.scrollTop=L.scrollHeight; }
const focusN = (id) => parent.postMessage({ pluginMessage: { focus: id } }, '*');
// @[нэр](nodeId) → дарахад тэр screen рүү очно
const fmt = (x) => esc(x)
  .replace(/@\[([^\]]+)\]\(([\d:;I]+)\)/g, '<span class="lk" data-n="$2">◎ $1</span>')
  .replace(/(^|[\s(])(\d+:\d+)(?=[\s,.)!?]|$)/g, '$1<span class="lk" data-n="$2">◎ $2</span>')
  .replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/(^|\n)[-•] +/g, '$1 • ')
  .replace(/(^|\n)(①|②|③|④|⑤)/g, '$1<span class="num">$2</span>');
const esc = (x) => String(x).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const expanded = {};
const hhmm = (t) => { const d = new Date(t || Date.now()); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
// Урт мессежийг FB коммент шиг хураана: эхний хэсэг + метрик мөр, дарахад дэлгэнэ
const openMsg = {}; const LONG = 260; let keepScroll = false;
function metrics(t){ const w = (t.match(/\S+/g) || []).length, parts = t.split(/\n\s*\n/).filter(x => x.trim()).length,
  pts = (t.match(/^\s*(?:\d+\.|•|-)\s/gm) || []).length, sec = Math.max(5, Math.round(w / 200 * 60));
  return w + ' үг · ' + parts + ' хэсэг' + (pts ? ' · ' + pts + ' заалт' : '') + ' · ~' + (sec < 60 ? sec + 'с' : Math.round(sec / 60) + 'мин') + ' унших'; }
function msgHtml(m, isReply) {
  const t = String(m.text || ''), long = t.length > LONG, open = openMsg[m.id];
  let body = fmt(t), meta = '';
  if (long && !open) { let cut = t.slice(0, 180); cut = cut.slice(0, Math.max(cut.lastIndexOf(' '), 120)); body = fmt(cut) + '…';
    meta = '<div class="mt" data-m="' + m.id + '">▸ ' + metrics(t) + ' · <u data-m="' + m.id + '">Цааш унших</u></div>'; }
  else if (long) meta = '<div class="mt" data-m="' + m.id + '">▴ <u data-m="' + m.id + '">Хураах</u></div>';
  return '<div class="msg ' + m.from + (isReply ? ' re' : '') + (long && !open ? ' clp' : '') + '"><span class="who">' + (m.from === 'user' ? esc(ME) : 'Claude') +
    '</span>' + body + '<span class="tm">' + hhmm(m.at) + '</span>' + meta + '</div>';
}
function render() {
  const roots = all.filter(c => !c.parent);
  const open = roots.filter(r => !r.resolved).length; $('n').textContent = open || '';
  if (!roots.length) { C.innerHTML = '<div class="empty">Node сонгоод доор бичээрэй.<br>Claude энд хариулна.</div>'; return; }
  C.innerHTML = roots.map(r => {
    const kids = all.filter(c => c.parent === r.id);
    const collapsed = kids.length > 3 && !expanded[r.id];
    const shown = collapsed ? kids.slice(-2) : kids;
    const hidden = kids.length - shown.length;
    const work = (CL.threads || []).includes(r.id) && CL.state !== 'idle';
    return '<div class="th' + (r.resolved ? ' done' : '') + (replyTo === r.id ? ' act' : '') + (work ? ' work' : '') + '" data-th="' + r.id + '">' +

      (r.node ? '<span class="node" data-n="' + r.node.id + '">◎ ' + esc(r.node.name) + '</span>' : '') +
      (kids.length ? '<span class="cnt">' + (kids.length + 1) + ' мессеж</span>' : '') +
      msgHtml(r, false) +
      (hidden > 0 ? '<div class="more" data-e="' + r.id + '">↕ өмнөх ' + hidden + ' мессежийг харах</div>' : '') +
      shown.map(m => msgHtml(m, true)).join('') +
      (r.status && r.status.state && r.status.state !== 'done' && !r.resolved ? '<div class="st ' + r.status.state + '">' + (r.status.state === 'working' ? '⏳ ажиллаж байна' : '🕐 дараалалд') + (r.status.text ? ' · ' + esc(r.status.text) : '') + ' · ' + hhmm(r.status.at) + '</div>' : '') +
      (work ? '<div class="msg re claude live"><span class="who">Claude</span><span class="wsp">✳</span> <b class="lvt"></b> <span class="lvd"></span><div class="lvm"></div></div>' : '') +
      '<div class="acts"><a data-r="' + r.id + '">↩ хариулах</a>' + (r.resolved ? '' : '<a data-x="' + r.id + '">✓ шийдсэн</a>') + '</div></div>';
  }).join('');
  if (!keepScroll) C.scrollTop = C.scrollHeight; keepScroll = false; try { renderCl(); } catch (e) {}
}
C.onclick = (e) => { const t = e.target;
  if (t.dataset.n) parent.postMessage({ pluginMessage: { focus: t.dataset.n } }, '*');
  if (t.dataset.e) { expanded[t.dataset.e] = true; keepScroll = true; render(); }
  if (t.dataset.m) { openMsg[t.dataset.m] = !openMsg[t.dataset.m]; const y = C.scrollTop; keepScroll = true; render(); C.scrollTop = y; return; }
  if (t.dataset.r) { replyTo = t.dataset.r;
    const root = all.filter(c => c.id === t.dataset.r)[0];
    const snip = root ? esc(String(root.text).slice(0, 34)) + (String(root.text).length > 34 ? '…' : '') : '';
    $('sel').innerHTML = '↩ <b>' + snip + '</b> · <a style="color:#888;cursor:pointer" id="cx">болих</a>';
    $('cx').onclick = () => { replyTo = null; showSel(); render(); }; render(); $('txt').focus(); }
  if (t.dataset.d) fetch('http://localhost:3055/comments', { method: 'POST', body: JSON.stringify({ delete: t.dataset.d }) });
  if (t.dataset.x) fetch('http://localhost:3055/comments', { method: 'POST', body: JSON.stringify({ resolve: t.dataset.x }) }); };
function showSel() { if (!replyTo) $('sel').innerHTML = 'Сонгосон: <b>' + esc(sel ? sel.name : '— (файл даяар)') + '</b>'; }
function send() { const text = $('txt').value.trim(); if (!text || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ newComment: replyTo ? { text, parent: replyTo } : { text, node: sel } }));
  $('txt').value = ''; replyTo = null; showSel(); render(); }
$('send').onclick = send; $('txt').onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send(); };
function connect() {

  ws.onclose = () => { s.textContent = 'салсан, дахин оролдож байна…'; dot.style.background='#ff7b72'; setTimeout(connect, 2000); };
  ws.onerror = () => {};

    if (m.claude) { const was = (CL.threads||[]).join(); CL = m.claude; renderCl(); if ((CL.threads||[]).join() !== was || CL.state === 'idle') { render(); const w = document.querySelector('.th.work'); if (w) w.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } return; }

// Claude Code-ийн амьд төлөв (hook → server /claude → WebSocket)
var CL = { state: 'idle' }; const SP = ['✻','✳','✢','·','✢','✳']; let spi = 0;

  if (CL.state === 'idle') { $('cl').querySelector('.sp').textContent = '●'; $('clt').textContent = 'Claude'; $('cld').textContent = CL.doneMs ? '✓ дууслаа' : 'хүлээж байна'; $('clm').textContent = CL.doneMs ? secs(CL.doneMs) + ' · ' + (CL.tools||0) + ' үйлдэл' : ''; return; }
  $('cl').querySelector('.sp').textContent = SP[spi = (spi+1) % SP.length];
  const t = CL.state === 'tool' ? (TOOLN[CL.tool] || (CL.tool||'').replace(/^mcp__[^_]+__/,'')) : 'Бодож байна';
  $('clt').textContent = t + '…'; $('cld').textContent = CL.state === 'tool' ? (CL.desc || '') : '';
  $('clm').textContent = secs(now - (CL.turnStart || now)) + ' · ' + (CL.tools||0) + ' үйлдэл'; }
setInterval(() => { if (CL.state !== 'idle') renderCl(); }, 250);
// ── сунгах · хураах (хэмжээ figma.clientStorage-д хадгалагдана)
let UI = { w: innerWidth, h: innerHeight, collapsed: false };
