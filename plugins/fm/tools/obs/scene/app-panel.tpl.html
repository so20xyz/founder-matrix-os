<!doctype html>
<html><head><meta charset="utf-8"><title>Apps</title>
<style>
  :root { color-scheme: dark; --bg:#1e2027; --card:#272a33; --line:#363a46; --text:#e4e6eb; --dim:#8b91a0; --acc:#3d7cf0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px; background: var(--bg); color: var(--text); font: 12px "Segoe UI", sans-serif; user-select: none; }
  .lbl { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 2px 2px 6px; display: flex; justify-content: space-between; }
  .lbl button { all: unset; cursor: pointer; color: var(--dim); font-size: 13px; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .slot { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 4px 6px; text-align: center; cursor: pointer; position: relative; }
  .slot.target { border-color: var(--acc); box-shadow: 0 0 0 2px #3d7cf033; }
  .slot .n { position: absolute; top: 4px; left: 6px; font-size: 10px; color: var(--dim); font-weight: 700; }
  .slot .name { margin-top: 5px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ic { background-size: 60%; background-repeat: no-repeat; background-position: center; }
  .ic.logo { font-size: 0; }
  .slot.over, .app.drag { border-color: var(--acc) !important; background: #2a3550; }
  .file { font-size: 9.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .ic { width: 34px; height: 34px; border-radius: 9px; display: inline-grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff; }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-bottom: 12px; }
  .app { background: transparent; border: 1.5px solid transparent; border-radius: 10px; padding: 6px 2px; text-align: center; cursor: pointer; }
  .app:hover { background: var(--card); border-color: var(--line); }
  .app.inslot { opacity: .45; }
  .app .name { margin-top: 4px; font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scenes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .sc { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 2px 5px; cursor: pointer; text-align: center; color: var(--dim); font-size: 10.5px; }
  .sc svg { display: block; margin: 0 auto 4px; }
  .sc.on { border-color: var(--acc); color: var(--text); background: #2a3550; }
  .cams { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; }
  .cam { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 2px 4px; cursor: pointer; text-align: center; color: var(--dim); font-size: 10px; }
  .cam.on { border-color: var(--acc); color: var(--text); background: #2a3550; }
  .cam svg { display: block; margin: 0 auto 3px; }
  .lbl { cursor: pointer; }
  .lbl .tg { margin-right: 6px; display: inline-block; width: 10px; transition: transform .15s; }
  .lbl.closed .tg { transform: rotate(-90deg); }
  .hidden { display: none !important; }
  #st { color: var(--dim); font-size: 10px; margin-top: 10px; text-align: center; min-height: 12px; }
</style></head>
<body>
<button id="rec" style="width:100%;margin-bottom:10px;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:600 13px 'Segoe UI';cursor:pointer">● Бичих</button>
<div class="lbl"><span>Дуу · микрофон</span></div>
<div id="aud" style="margin-bottom:12px"></div>
<div class="lbl"><span>Дэлгэц · 1 = идэвхтэй</span></div>
<div class="slots" id="slots"></div>
<div class="lbl"><span>Нээлттэй апп · дэлгэц рүү чирж оруул</span><button id="refresh" title="Шинэчлэх">↻</button></div>
<div class="apps" id="apps"></div>
<div class="lbl"><span>Scene</span></div>
<div class="scenes" id="scenes"></div>
<div class="lbl" style="margin-top:12px"><span id="camlbl">Камер</span></div>
<div class="cams" id="cams"></div>
<div class="lbl" style="margin-top:12px"><span>IG safe area (зөвхөн харах — бичлэг эхлэхэд автоматаар унтарна)</span></div>
<div class="cams" id="safe"></div>
<div id="st"></div>
<script>
const PASS = "__PASS__", PORT = __PORT__;
const SLOTS = ["Апп 1", "Апп 2", "Апп 3"];
// icon = layout thumbnail of the 9:16 scene
const SCENES = [
  ["V1b · Идэвхтэй", "Бүтэн", [[2,6,16,9],[2,17,16,10]]],
  ["V1 · Идэвхтэй", "Тайрсан", [[2,2,16,14],[2,17,16,10]]],
  ["V3 · Сүүлийн 2", "2 апп", [[2,2,16,7],[2,10,16,7],[4,18,12,8]]],
  ["3 · Сүүлийн 3", "3 апп", [[2,2,16,7],[2,10,16,7],[2,18,16,7]]],
];
const BRAND = { claude: ["#d97757","C"], figma: ["#a259ff","F"], obsidian: ["#7c3aed","O"], brave: ["#fb542b","B"], chrome: ["#1a73e8","G"],
  code: ["#007acc","VS"], cursor: ["#111","Cu"], discord: ["#5865f2","D"], warp: ["#01a4ff","W"], notion: ["#000","N"], slack: ["#4a154b","S"],
  telegram: ["#2aabee","T"], viber: ["#7360f2","V"], framer: ["#0055ff","Fr"], photoshop: ["#31a8ff","Ps"], premiere: ["#9999ff","Pr"],
  afterfx: ["#9999ff","Ae"], msedge: ["#0c7cd5","E"], windowsterminal: ["#333","&gt;"], explorer: ["#f2b705","📁"] };
let ws, seq = 0, target = 0, windows = []; const pend = {};
const st = t => document.getElementById("st").textContent = t || "";
const exeOf = v => (v.split(":").pop() || "").toLowerCase().replace(/\.exe$/, "");
const titleOf = v => (v.split(":")[0] || "").replace(/#3A/g, ":");
const LOGOS = __LOGOS__;   // vault 03-Areas/Studio/assets/social-logos, white glyph on the brand color
// the camera as a pseudo-app: a slot holding CAM shows the camera there (obs-scene-toggle.lua mirrors the slot's box)
const CAM = "Камер:FM_CAMERA:fm_camera";
function icon(exe) {
  if (exe === "fm_camera") return `<span class="ic" style="background:#2b2f3a;font-size:22px">📷</span>`;
  const key = Object.keys(BRAND).find(k => exe === k) || Object.keys(BRAND).find(k => exe.includes(k));
  const b = key && BRAND[key];
  let hue = 0; for (const c of exe) hue = (hue * 31 + c.charCodeAt(0)) % 360;
  const [bg, txt] = b || [`hsl(${hue} 45% 42%)`, (exe[0] || "?").toUpperCase()];
  const logo = LOGOS[key || exe];
  return logo ? `<span class="ic logo" style="background-color:${bg};background-image:url('${logo}')">${txt}</span>`
              : `<span class="ic" style="background:${bg}">${txt}</span>`;
}
const fileOf = v => { const t = titleOf(v); return t.split(/ [-–—•|] /)[0] || t; };
const appName = v => { const e = exeOf(v); if (e === "fm_camera") return "Камер"; return e ? e[0].toUpperCase() + e.slice(1) : "—"; };
async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return btoa(String.fromCharCode(...new Uint8Array(b))); }
// record button (same OBS recording; the timer shows while recording)
let recOn = false, recT0 = 0;
function recUi(on, t0) { recOn = !!on; recT0 = t0 || 0; const b = document.getElementById("rec"); b.style.background = on ? "#8a1f1f" : ""; b.style.borderColor = on ? "#e04444" : ""; tickRec(); }
function tickRec() { const b = document.getElementById("rec"); if (!recOn) { b.textContent = "● Бичих"; return; } const s = Math.floor((Date.now() - recT0) / 1000); b.textContent = "■ Зогсоох · " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
setInterval(tickRec, 500);
document.getElementById("rec").onclick = () => call(recOn ? "StopRecord" : "StartRecord");
function call(type, data = {}) { return new Promise(r => { const id = String(++seq); pend[id] = r; ws.send(JSON.stringify({ op: 6, d: { requestType: type, requestId: id, requestData: data } })); }); }
function connect() {
  ws = new WebSocket("ws://127.0.0.1:" + PORT);
  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.op === 0) {
      const a = m.d.authentication;
      ws.send(JSON.stringify({ op: 1, d: { rpcVersion: 1, authentication: a ? await sha(await sha(PASS + a.salt) + a.challenge) : undefined, eventSubscriptions: 4 | 8 | 64 | 65536 } }));
    } else if (m.op === 2) { st(""); renderAudio(); const rs = (await call("GetRecordStatus")).responseData || {}; recUi(rs.outputActive, Date.now() - (rs.outputDuration || 0)); await loadWindows(); render(); }
    else if (m.op === 7) { pend[m.d.requestId]?.(m.d); delete pend[m.d.requestId]; }
    else if (m.op === 5) {
      if (m.d.eventType === "CurrentProgramSceneChanged") markScene(m.d.eventData.sceneName);
      if (m.d.eventType === "RecordStateChanged") { const o = m.d.eventData.outputState; if (o === "OBS_WEBSOCKET_OUTPUT_STARTED") recUi(true, Date.now()); if (o === "OBS_WEBSOCKET_OUTPUT_STOPPED") { recUi(false); st("Хадгалав: " + String(m.d.eventData.outputPath || "").split("/").pop()); } }
      if (m.d.eventType === "RecordStateChanged" && m.d.eventData.outputState === "OBS_WEBSOCKET_OUTPUT_STARTING") { setSafe(null).then(renderSafe); st("Бичлэг эхэллээ → safe area унтарлаа"); }
      if (m.d.eventType === "InputSettingsChanged" && SLOTS.includes(m.d.eventData.inputName)) renderSlots();
      if (m.d.eventType === "InputVolumeMeters") meters(m.d.eventData.inputs);
      if (m.d.eventType === "InputMuteStateChanged" || m.d.eventType === "InputVolumeChanged") renderAudio();
    }
  };
  ws.onclose = () => { st("OBS-тэй холбоо тасарсан…"); setTimeout(connect, 2000); };
}
async function loadWindows() {
  const r = await call("GetInputPropertiesListPropertyItems", { inputName: SLOTS[0], propertyName: "window" });
  const seen = new Set(); windows = [CAM];
  for (const i of r.responseData?.propertyItems || []) {
    const e = exeOf(i.itemValue || "");
    if (!e || seen.has(e)) continue;   // one tile per app (OBS too: its window can be shown in a slot)
    seen.add(e); windows.push(i.itemValue);
  }
}
async function slotValues() { return Promise.all(SLOTS.map(async s => (await call("GetInputSettings", { inputName: s })).responseData?.inputSettings?.window || "")); }
async function renderSlots() {
  const vals = await slotValues();
  document.getElementById("slots").innerHTML = vals.map((v, i) =>
    `<div class="slot ${i === target ? "target" : ""}" draggable="true" data-i="${i}" title="${titleOf(v)}"><span class="n">${i + 1}</span>${icon(exeOf(v))}<div class="name">${appName(v)}</div><div class="file">${fileOf(v)}</div></div>`).join("");
  document.querySelectorAll(".slot").forEach(el => {
    el.onclick = () => { target = +el.dataset.i; renderSlots(); };
    el.ondragstart = e => e.dataTransfer.setData("text/slot", el.dataset.i);
    el.ondragover = e => { e.preventDefault(); el.classList.add("over"); };
    el.ondragleave = () => el.classList.remove("over");
    el.ondrop = async e => {
      e.preventDefault(); el.classList.remove("over");
      const to = +el.dataset.i, app = e.dataTransfer.getData("text/app"), from = e.dataTransfer.getData("text/slot");
      if (app !== "") { target = to; await assign(windows[+app]); }
      else if (from !== "" && +from !== to) {            // slot onto slot: swap the two windows
        const a = vals[+from], b = vals[to];
        await set(SLOTS[to], a); await set(SLOTS[+from], b); target = to; st(`${+from + 1} ⇄ ${to + 1}`); renderSlots();
      }
    };
  });
  const inSlot = new Set(vals.map(exeOf));
  document.getElementById("apps").innerHTML = windows.map((v, i) =>
    `<div class="app ${inSlot.has(exeOf(v)) ? "inslot" : ""}" draggable="true" data-i="${i}" title="${titleOf(v)}">${icon(exeOf(v))}<div class="name">${appName(v)}</div><div class="file">${fileOf(v)}</div></div>`).join("");
  document.querySelectorAll(".app").forEach(el => {
    el.onclick = () => assign(windows[+el.dataset.i]);
    el.ondragstart = e => { e.dataTransfer.setData("text/app", el.dataset.i); el.classList.add("drag"); };
    el.ondragend = () => el.classList.remove("drag");
  });
}
async function set(slot, v) {
  await call("SetInputSettings", { inputName: slot, inputSettings: { window: v, priority: 2, method: 2 } });
  await call("RemoveSourceFilter", { sourceName: slot, filterName: "obs-zoom-to-mouse-crop" });
}
async function assign(v) {
  await set(SLOTS[target], v);
  st(`${target + 1} → ${appName(v)}`); renderSlots();
}
function thumb(rects) { return `<svg width="22" height="30" viewBox="0 0 20 28"><rect x=".5" y=".5" width="19" height="27" rx="3" fill="none" stroke="currentColor" opacity=".5"/>${rects.map(([x,y,w,h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="currentColor" opacity=".8"/>`).join("")}</svg>`; }
function renderScenes() {
  document.getElementById("scenes").innerHTML = SCENES.map(([n, l, r]) => `<div class="sc" data-n="${n}">${thumb(r)}${l}</div>`).join("");
  document.querySelectorAll(".sc").forEach(el => el.onclick = () => call("SetCurrentProgramScene", { sceneName: el.dataset.n }));
}
// Camera + autolayout per scene, fitted to the Reels safe area (generated by gen_layouts.cjs -> layouts.json).
// The chosen layout stays until another one is picked.
const LAY = __LAYOUTS__;
const APPS3 = ["Апп 1", "Апп 2", "Апп 3"];
let camScene = "";
async function itemId(scene, src) { return (await call("GetSceneItemId", { sceneName: scene, sourceName: src })).responseData?.sceneItemId ?? null; }
async function setBox(g, src, b) {
  const id = await itemId(g, src); if (id == null) return;
  await call("SetSceneItemTransform", { sceneName: g, sceneItemId: id, sceneItemTransform: { positionX: b[0], positionY: b[1], boundsWidth: b[2], boundsHeight: b[3] } });
}
async function apply(l) {
  for (const op of l.ops) {
    if (op.box) await setBox(op.box[0], op.box[1], op.box[2]);
    if (op.vis) { const id = await itemId(op.vis[0], op.vis[1]); if (id != null) await call("SetSceneItemEnabled", { sceneName: op.vis[0], sceneItemId: id, sceneItemEnabled: op.vis[2] }); }
    if (op.mask) await call("SetSourceFilterSettings", { sourceName: op.mask[0], filterName: LAY.MASKF[op.mask[0]], filterSettings: { image_path: LAY.A + op.mask[1] } });
    if (op.panes) {
      // the two visible apps take the two boxes, upper then lower (which app is on top stays)
      const [g, boxes] = op.panes;
      const items = ((await call("GetGroupSceneItemList", { sceneName: g })).responseData?.sceneItems || []).filter(i => APPS3.includes(i.sourceName));
      const vis = items.filter(i => i.sceneItemEnabled).sort((a, b) => a.sceneItemTransform.positionY - b.sceneItemTransform.positionY);
      for (const [n, it] of vis.entries()) if (boxes[n]) await setBox(g, it.sourceName, boxes[n]);
      for (const it of items.filter(i => !i.sceneItemEnabled)) await setBox(g, it.sourceName, boxes[1]);
    }
  }
}
function lthumb(rects) {
  return '<svg width="18" height="26" viewBox="0 0 20 28"><rect x=".5" y=".5" width="19" height="27" rx="3" fill="none" stroke="currentColor" opacity=".5"/>' +
    rects.map((r, i) => '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" rx="1.5" fill="currentColor" opacity="' + (i === rects.length - 1 && rects.length > 1 ? 1 : .55) + '"/>').join("") + "</svg>";
}
async function renderCams() {
  const L = LAY.layouts[camScene] || [], el0 = document.getElementById("cams");
  document.getElementById("camlbl").textContent = "Камер · layout · " + (camScene || "—");
  if (!L.length) { el0.innerHTML = '<div class="cam" style="grid-column:1/-1">энэ scene-д тохиргоогүй</div>'; return; }
  el0.innerHTML = L.map((l, i) => '<div class="cam" data-i="' + i + '" title="' + l.label + '">' + lthumb(l.icon) + l.label + "</div>").join("");
  el0.querySelectorAll(".cam").forEach(el => el.onclick = async () => {
    el0.querySelectorAll(".cam").forEach(x => x.classList.remove("on")); el.classList.add("on");
    await apply(L[+el.dataset.i]); st("Layout → " + L[+el.dataset.i].label);
  });
}

// IG safe-area overlays (Figma «IG Safe Area», white dashed guides) in every scene, one at a time
const SAFE = [["Унтраах", null], ["Reels", "IG Reels safe"], ["Story", "IG Story safe"]];
const SAFE_SCENES = ["V1 · Идэвхтэй", "V1b · Идэвхтэй", "V3 · Сүүлийн 2", "3 · Сүүлийн 3"];
async function setSafe(which) {
  for (const sc of SAFE_SCENES) for (const [, src] of SAFE) {
    if (!src) continue;
    const id = await itemId(sc, src); if (id == null) continue;
    await call("SetSceneItemEnabled", { sceneName: sc, sceneItemId: id, sceneItemEnabled: src === which });
  }
}
// sound: live level bar (InputVolumeMeters, ~20/s), volume slider (dB), mute — Mic/Aux (Scarlett) + Desktop Audio
const AUD = [["Mic/Aux", "🎙 Mic"], ["Desktop Audio", "🔊 Desktop"]];
async function renderAudio() {
  const el = document.getElementById("aud"); if (!el) return;
  const rows = [];
  for (const [n, l] of AUD) {
    const v = (await call("GetInputVolume", { inputName: n })).responseData;
    const mu = (await call("GetInputMute", { inputName: n })).responseData;
    if (!v) continue;
    const db = Math.max(-60, Math.round(v.inputVolumeDb * 10) / 10);
    rows.push('<div style="display:grid;grid-template-columns:76px 1fr 46px 28px;gap:6px;align-items:center;margin:4px 0">' +
      '<span style="color:var(--dim);font-size:11px">' + l + '</span>' +
      '<div><div style="height:6px;border-radius:3px;background:#30333d;overflow:hidden"><div data-meter="' + n + '" style="height:100%;width:0;background:#3fbf6f;transition:width .08s"></div></div>' +
      '<input type="range" min="-60" max="0" step="0.5" value="' + db + '" data-vol="' + n + '" style="width:100%;margin:2px 0 0"></div>' +
      '<span data-db="' + n + '" style="font-size:11px;text-align:right">' + db + ' dB</span>' +
      '<button data-mute="' + n + '" style="all:unset;cursor:pointer;text-align:center;font-size:14px">' + (mu?.inputMuted ? "🔇" : "🔈") + '</button></div>');
  }
  el.innerHTML = rows.join("");
  el.querySelectorAll("[data-vol]").forEach(r => {
    r.oninput = () => { el.querySelector('[data-db="' + r.dataset.vol + '"]').textContent = r.value + " dB"; };
    r.onchange = () => call("SetInputVolume", { inputName: r.dataset.vol, inputVolumeDb: Number(r.value) });
  });
  el.querySelectorAll("[data-mute]").forEach(b => b.onclick = async () => { await call("ToggleInputMute", { inputName: b.dataset.mute }); renderAudio(); });
}
function meters(inputs) {
  for (const i of inputs || []) {
    const bar = document.querySelector('[data-meter="' + i.inputName + '"]'); if (!bar) continue;
    const peak = Math.max(0, ...(i.inputLevelsMul || []).map(c => c[1] ?? 0));
    const db = peak > 0 ? 20 * Math.log10(peak) : -60;
    const pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100));
    bar.style.width = pct + "%";
    bar.style.background = db > -6 ? "#e05252" : db > -20 ? "#e8c547" : "#3fbf6f";
  }
}
async function renderSafe() {
  let cur = 0;
  for (const [i, [, src]] of SAFE.entries()) if (src) { const id = await itemId(SAFE_SCENES[0], src); if (id != null && (await call("GetSceneItemEnabled", { sceneName: SAFE_SCENES[0], sceneItemId: id })).responseData?.sceneItemEnabled) cur = i; }
  const el0 = document.getElementById("safe");
  const ic = i => i === 0 ? lthumb([]) : i === 1 ? lthumb([[2, 4, 13, 16], [16, 13, 2, 7]]) : lthumb([[2, 5, 16, 17]]);
  el0.innerHTML = SAFE.map(([l], i) => '<div class="cam' + (i === cur ? " on" : "") + '" data-i="' + i + '">' + ic(i) + l + "</div>").join("");
  el0.querySelectorAll(".cam").forEach(el => el.onclick = async () => { await setSafe(SAFE[+el.dataset.i][1]); st("Safe area → " + SAFE[+el.dataset.i][0]); renderSafe(); });
}

function markScene(n) { document.querySelectorAll(".sc").forEach(b => b.classList.toggle("on", b.dataset.n === n)); if (n && n !== camScene) { camScene = n; renderCams(); } }
async function render() { renderScenes(); await renderSlots(); renderSafe(); markScene((await call("GetCurrentProgramScene")).responseData?.sceneName); }
document.getElementById("refresh").onclick = async () => { await loadWindows(); renderSlots(); };
setInterval(async () => { if (ws?.readyState === 1) { await loadWindows(); renderSlots(); } }, 15000);
// visible toggle per section (remembered): click a section title to show / hide it
function setupToggles() {
  let saved = {}; try { saved = JSON.parse(localStorage.getItem("panel-sections") || "{}"); } catch {}
  document.querySelectorAll(".lbl").forEach((lbl, i) => {
    const body = lbl.nextElementSibling; if (!body || body.id === "st") return;
    const key = "s" + i;
    const span = lbl.querySelector("span"); const tg = document.createElement("span"); tg.className = "tg"; tg.textContent = "▾"; span.prepend(tg);
    const show = v => { body.classList.toggle("hidden", !v); lbl.classList.toggle("closed", !v); };
    show(saved[key] !== false);
    lbl.addEventListener("click", e => {
      if (e.target.closest("button")) return;
      const v = body.classList.contains("hidden"); show(v); saved[key] = v;
      try { localStorage.setItem("panel-sections", JSON.stringify(saved)); } catch {}
    });
  });
}
setupToggles();
connect();
</script>
</body></html>
