<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox Gallery</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1b1a;--mute:#6d6b66;--line:#e4e1da;--acc:#2f5bd3;--warn:#b5462b;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe7;--mute:#9a978f;--line:#2e2d2a;--acc:#7b9cff;--warn:#e07a5f;--ok:#6fbf8e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:17px;margin:0 8px 0 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sp{flex:1}
button.main{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
button.main:disabled{opacity:.4;cursor:default}
.sum{color:var(--mute);font-size:13px}
main{padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card.changed{outline:2px solid var(--acc)}
.thumb{height:160px;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb.grid{display:grid;grid-template-columns:1fr 1fr}
.thumb .txt{padding:12px;font-size:12.5px;color:var(--mute);height:100%;overflow:hidden;align-self:stretch}
.body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{font-weight:600;font-size:13.5px;word-break:break-word}
.meta{color:var(--mute);font-size:12px}
.why{font-size:12px;color:var(--mute)}
select{width:100%;padding:6px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;margin-top:auto}
a{color:var(--acc)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:560px;width:calc(100% - 32px)}
dialog pre{white-space:pre-wrap;font-size:12.5px;max-height:50vh;overflow:auto}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px}
</style>
</head>
<body>
<header>
  <h1>📥 Inbox Gallery</h1>
  <span id="filters"></span>
  <span class="sp"></span>
  <span class="sum" id="sum"></span>
  <button class="chip" id="acceptAll" title="Бүх саналыг сонголт болгох">Саналыг бүгдийг авах</button>
  <button class="chip" id="refresh">↻</button>
  <button class="main" id="apply" disabled>Apply</button>
</header>
<main id="grid"></main>
<dialog id="dlg"><h3 id="dlgT"></h3><pre id="dlgB"></pre>
  <form method="dialog" style="display:flex;gap:8px;justify-content:flex-end">
    <button class="chip" value="no">Болих</button><button class="main" id="dlgOk" value="ok">Зөөх</button>
  </form></dialog>
<script>
const KIND={all:"Бүгд",note:"📝 Note",image:"🖼 Зураг",video:"🎞 Видео",folder:"📁 Хавтас"};
let S={items:[],dest:[],choice:{},filter:"all"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label=id=>(S.dest.find(d=>d.id===id)||{label:id}).label;
async function load(refresh){
  $("#grid").innerHTML='<div class="empty">Ачаалж байна…</div>';
  const r=await fetch("/api/items"+(refresh?"?refresh=1":"")).then(r=>r.json());
  S.items=r.items;S.dest=r.destinations;S.choice={};render();
}
function render(){
  const cnt={all:S.items.length};S.items.forEach(i=>cnt[i.kind]=(cnt[i.kind]||0)+1);
  $("#filters").innerHTML=Object.keys(KIND).filter(k=>cnt[k]).map(k=>`<button class="chip ${S.filter===k?"on":""}" data-f="${k}">${KIND[k]} ${cnt[k]}</button>`).join(" ");
  const list=S.items.filter(i=>S.filter==="all"||i.kind===S.filter);
  $("#grid").innerHTML=list.length?list.map(card).join(""):'<div class="empty">Inbox хоосон 🎉</div>';
  const n=Object.values(S.choice).filter(v=>v!=="keep").length;
  $("#sum").textContent=n?`${n} зүйл зөөхөөр сонгосон`:"Юу ч сонгоогүй";
  $("#apply").disabled=!n;
}
function card(i){
  const f=encodeURIComponent(i.name);let th;
  if(i.kind==="image")th=`<img loading="lazy" src="/file?p=${f}">`;
  else if(i.kind==="video")th=`<video src="/file?p=${f}" muted preload="metadata"></video>`;
  else if(i.kind==="folder")th=i.thumbs.length?i.thumbs.map(t=>`<img loading="lazy" src="/file?p=${encodeURIComponent(t)}">`).join(""):`<div class="txt">Хоосон хавтас</div>`;
  else th=`<div class="txt">${esc(i.preview)||"—"}</div>`;
  const cur=S.choice[i.name]??"keep";
  const opts=S.dest.map(d=>`<option value="${esc(d.id)}" ${d.id===cur?"selected":""}>${esc(d.label)}${d.id===i.suggest?"  ← санал":""}</option>`).join("");
  return `<div class="card ${cur!=="keep"?"changed":""}">
   <div class="thumb ${i.kind==="folder"&&i.thumbs.length>1?"grid":""}">${th}</div>
   <div class="body"><div class="title">${esc(i.title)}</div>
   <div class="meta">${KIND[i.kind]||i.kind} · ${i.mtime} · ${(i.size/1024).toFixed(0)} KB${i.kind==="folder"?` · ${i.count} файл`:""}${i.embedded?` · 🔗 ${i.embedded}`:""}</div>
   ${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener" class="meta">эх линк ↗</a>`:""}
   <div class="why">💡 ${esc(label(i.suggest))} — ${esc(i.reason)}</div>
   <select data-n="${esc(i.name)}">${opts}</select></div></div>`;
}
document.addEventListener("click",e=>{const f=e.target.dataset.f;if(f){S.filter=f;render();}});
document.addEventListener("change",e=>{if(e.target.dataset.n!==undefined){S.choice[e.target.dataset.n]=e.target.value;render();}});
$("#refresh").onclick=()=>load(true);
$("#acceptAll").onclick=()=>{S.items.forEach(i=>S.choice[i.name]=i.suggest);render();};
$("#apply").onclick=()=>{
  const d=Object.entries(S.choice).filter(([,v])=>v!=="keep");
  $("#dlgT").textContent=`${d.length} зүйлийг зөөх үү?`;
  $("#dlgB").textContent=d.map(([n,v])=>`• ${n}\n   → ${label(v)}`).join("\n")+"\n\nУстгахгүй: Trash = _trash/ руу зөөнө.";
  $("#dlg").showModal();
};
$("#dlg").addEventListener("close",async()=>{
  if($("#dlg").returnValue!=="ok")return;
  const decisions=Object.fromEntries(Object.entries(S.choice).filter(([,v])=>v!=="keep"));
  const r=await fetch("/api/apply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({decisions})}).then(r=>r.json());
  alert(`✅ ${r.done?.length||0} зөөв`+(r.errors?.length?`\n⚠️ ${r.errors.join("\n")}`:""));
  load(true);
});
load();
</script>
</body>
</html>
