# FMOS n8n stack — "ears" layer (Gmail/Notion/Calendar/Telegram/IG → Discord).
# Brief: vault 03-Projects/3-On-hold/Founder Matrix/n8n + Docker brief.md
# Usage: cp .env.example .env  (fill secrets locally, never commit)  →  docker compose up -d  →  http://localhost:5678
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 10s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ:-Asia/Ulaanbaatar}
      TZ: ${TZ:-Asia/Ulaanbaatar}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      FMOS_TELEGRAM_TOKEN: ${FMOS_TELEGRAM_TOKEN:-}
      FMOS_INBOX_CHANNEL_ID: ${FMOS_INBOX_CHANNEL_ID:-}
    volumes:
      - n8n:/home/node/.n8n
      - ./workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db:
  n8n:
